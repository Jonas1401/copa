<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="CopaLinks">
  <!--
    Badge monocromático (o Android pinta de uma cor só): caminhão da CopaLinks.
    Regra obrigatória: somente BRANCO (#ffffff) sobre TRANSPARENTE. Qualquer
    outra cor faz o Android desenhar um quadrado cinza na barra de status.
    Este SVG é a fonte em vetor; o arquivo usado na notificação é o
    /icons/copalinks-badge-72.png (72x72, branco sobre transparente).
  -->
  <g fill="#ffffff">
    <!-- carreta -->
    <path d="M10 28 H56 V62 H10 Z"/>
    <!-- cavalo -->
    <path d="M60 36 H74 C76 36 77.5 37 78.5 38.6 L86 50 V62 H60 Z"/>
    <!-- chassi -->
    <path d="M8 62 H88 V66 H8 Z"/>
    <!-- rodas -->
    <circle cx="20" cy="70" r="7"/>
    <circle cx="36" cy="70" r="7"/>
    <circle cx="68" cy="70" r="7"/>
    <circle cx="80" cy="70" r="7"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72" role="img" aria-label="CopaLinks">
  <!--
    Badge monocromático (o Android pinta de uma cor só): caminhão da CopaLinks
    com o rastro de velocidade.

    Regra obrigatória: somente BRANCO (#ffffff) sobre TRANSPARENTE. O Android
    usa o arquivo como MÁSCARA — se o desenho for preto, ou se o PNG vier com
    fundo opaco, o sistema não consegue recortar e desenha um quadradinho
    cinza na barra de status no lugar do caminhão.

    Este SVG é a fonte em vetor. O arquivo usado na notificação é gerado por:
      node scripts/gerar-badge.mjs     → public/icons/copalinks-badge-72.png
  -->
  <g fill="#ffffff">
    <!-- rastro de velocidade -->
    <rect x="4" y="25" width="10" height="3" rx="1.5"/>
    <rect x="4" y="33" width="6" height="3" rx="1.5"/>
    <rect x="4" y="41" width="10" height="3" rx="1.5"/>
    <!-- carreta (baú) -->
    <rect x="16" y="17" width="30" height="20" rx="3"/>
    <!-- cavalo -->
    <path d="M48 37 V24 Q48 21 51.5 21 H57.5 Q60.5 21 62.5 24 L66 30 V37 Z"/>
    <!-- rodas -->
    <circle cx="38" cy="49" r="6.5"/>
    <circle cx="60" cy="49" r="6.5"/>
  </g>
</svg>
